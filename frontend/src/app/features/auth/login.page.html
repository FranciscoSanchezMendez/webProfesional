<section class="auth-page">
  <h1>{{ 'auth.loginTitle' | translate }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="form">
    @if (errorKey(); as key) {
      <p class="form-alert" role="alert" data-testid="form-error">{{ key | translate }}</p>
    }

    <div class="field">
      <label for="login-email">{{ 'auth.email' | translate }}</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        aria-describedby="login-email-error"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
      />
      <app-field-error [control]="form.controls.email" errorId="login-email-error" />
    </div>

    <div class="field">
      <label for="login-password">{{ 'auth.password' | translate }}</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        aria-describedby="login-password-error"
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
      />
      <app-field-error [control]="form.controls.password" errorId="login-password-error" />
    </div>

    <label class="checkbox">
      <input type="checkbox" formControlName="remember_me" />
      <span>{{ 'auth.rememberMe' | translate }}</span>
    </label>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
      {{ (submitting() ? 'auth.submitting' : 'auth.submitLogin') | translate }}
    </button>
  </form>

  <p class="auth-switch">
    {{ 'auth.noAccount' | translate }}
    <a routerLink="/register">{{ 'auth.goRegister' | translate }}</a>
  </p>
</section>
