<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__about">
      <p class="site-footer__brand">{{ 'app.name' | translate }}</p>
      <p class="muted">{{ 'footer.tagline' | translate }}</p>
      <p class="muted">
        <a routerLink="/">{{ 'footer.creator' | translate }}</a> · © {{ year }}
      </p>
    </div>

    <nav class="site-footer__links" [attr.aria-label]="'footer.navLabel' | translate">
      <a routerLink="/about">{{ 'footer.about' | translate }}</a>
      <a routerLink="/contact">{{ 'footer.contact' | translate }}</a>
      <a routerLink="/faq">{{ 'footer.faq' | translate }}</a>
    </nav>

    <div class="site-footer__prefs">
      <label class="pref">
        <span>{{ 'footer.language' | translate }}</span>
        <select
          data-testid="language-select"
          [value]="language.current()"
          (change)="changeLanguage($any($event.target).value)"
        >
          @for (lang of languages; track lang) {
            <option [value]="lang" [selected]="lang === language.current()">
              {{ languageNames[lang] }}
            </option>
          }
        </select>
      </label>
      <label class="pref">
        <span>{{ 'footer.theme' | translate }}</span>
        <select
          data-testid="theme-select"
          [value]="theme.current()"
          (change)="changeTheme($any($event.target).value)"
        >
          @for (t of themes; track t) {
            <option [value]="t" [selected]="t === theme.current()">
              {{ themeKeys[t] | translate }}
            </option>
          }
        </select>
      </label>
    </div>
  </div>
</footer>
