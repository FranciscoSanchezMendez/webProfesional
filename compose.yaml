# Entorno de desarrollo local: docker compose up --build
name: personalprofile

services:
  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-personalprofile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personalprofile_dev}
      POSTGRES_DB: ${POSTGRES_DB:-personalprofile}
    # PostgreSQL 18+: el volumen se monta en /var/lib/postgresql (PGDATA vive en un subdirectorio por versión).
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    # Solo en desarrollo: migraciones automáticas al arrancar. En staging/producción son un paso explícito.
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-personalprofile}:${POSTGRES_PASSWORD:-personalprofile_dev}@db:5432/${POSTGRES_DB:-personalprofile}
      # Base separada para pytest (se crea si no existe; el nombre debe terminar en _test).
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-personalprofile}:${POSTGRES_PASSWORD:-personalprofile_dev}@db:5432/${POSTGRES_DB:-personalprofile}_test
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      # El bind mount desde Windows no emite eventos inotify: forzar polling para --reload.
      WATCHFILES_FORCE_POLLING: "true"
      # Cachés de herramientas fuera del bind mount (puede no ser escribible por appuser).
      RUFF_CACHE_DIR: /tmp/ruff-cache
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # Protección anti-SSRF del SSR de Angular: hosts aceptados en la cabecera Host.
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./frontend:/app
      # node_modules y caché de la imagen (Linux, propiedad de node), no los del host.
      - /app/node_modules
      - /app/.angular
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:4200"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4200/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  pgdata:
