[project]
name = "personalprofile-backend"
version = "0.1.0"
description = "API FastAPI de PersonalProfile"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.isort]
# La carpeta alembic/ (migraciones) no es el paquete alembic.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: requiere PostgreSQL (TEST_DATABASE_URL)"]

[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
# Prefijo de fecha para ordenar las migraciones en el explorador de archivos.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "exec"
executable = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "exec"
executable = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
