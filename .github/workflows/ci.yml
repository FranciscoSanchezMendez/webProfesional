name: CI

on:
  push:
    branches: [develop, preproduction, production]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: personalprofile_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d personalprofile_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/personalprofile_test
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng lint
      - run: npx ng test --watch=false
      - run: npx ng build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Construir imágenes de producción
        run: |
          docker build --target prod -t personalprofile-backend:ci backend
          docker build --target prod -t personalprofile-frontend:ci frontend
      - name: Entorno de desarrollo completo con Compose
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Comprobar conectividad frontend -> backend -> PostgreSQL
        run: |
          curl --fail --silent http://localhost:8000/api/v1/health
          curl --fail --silent http://localhost:4200/api/v1/health/ready
          curl --fail --silent http://localhost:4200/ | grep -q "PersonalProfile"
      - name: Logs en caso de fallo
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
